name: Windows PowerShell

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PowerShell 5.1 syntax
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in Get-ChildItem -File -Filter '*.ps1') {
              $tokens = $null
              $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
              if ($errors) { throw "$($file.Name): $errors" }
          }
      - name: Check encrypted site storage
        shell: powershell
        run: ./tests/site-store.tests.ps1
      - name: Check embedded dashboard theme scope
        shell: powershell
        run: node ./tests/admin-theme.test.cjs
