name: Windows PowerShell

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PowerShell 5.1 syntax
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in Get-ChildItem -File -Filter '*.ps1') {
              $tokens = $null
              $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
              if ($errors) { throw "$($file.Name): $errors" }
          }
      - name: Check encrypted site storage
        shell: powershell
        run: ./tests/site-store.tests.ps1
      - name: Check Cloudflare deployment recovery
        shell: powershell
        run: ./tests/deploy-resume.tests.ps1
      - name: Check optional domain deployment
        shell: powershell
        run: ./tests/deploy-options.tests.ps1
      - name: Check wizard inputs
        timeout-minutes: 3
        shell: powershell
        run: ./tests/wizard-input.tests.ps1
      - name: Check embedded README rendering
        shell: powershell
        run: ./tests/readme-view.tests.ps1
      - name: Check embedded dashboard theme scope
        shell: powershell
        run: node ./tests/admin-theme.test.cjs
      - name: Check password verification
        shell: powershell
        run: |
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          $output = Join-Path $env:RUNNER_TEMP 'SiteAuthTests.exe'
          $source = Join-Path $PWD 'launcher\SiteAuth.cs'
          $tests = Join-Path $PWD 'tests\site-auth.tests.cs'
          & $compiler /nologo /target:exe "/out:$output" /reference:System.Net.Http.dll /reference:System.Web.Extensions.dll $source $tests
          if ($LASTEXITCODE -ne 0) { throw 'Password verifier compilation failed' }
          & $output
          if ($LASTEXITCODE -ne 0) { throw 'Password verifier regression failed' }
