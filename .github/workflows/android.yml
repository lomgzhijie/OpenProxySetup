name: Android

on:
  push:
    paths:
      - 'android/**'
      - 'vendor/edgetunnel/**'
      - 'assets/admin-theme.js'
      - 'README*.md'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'vendor/edgetunnel/**'
      - 'assets/admin-theme.js'
      - 'README*.md'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Android SDK components
        run: |
          sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          test -x "$sdkmanager"
          printf '%s\n' "$(dirname "$sdkmanager")" "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          "$sdkmanager" --licenses < <(yes) >/dev/null
          "$sdkmanager" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' 'emulator' 'system-images;android-30;google_apis;x86_64'
      - name: Build with a disposable test key
        shell: pwsh
        run: |
          ./android/build.ps1 -Jdk $env:JAVA_HOME_17_X64 `
            -BuildTools "$env:ANDROID_HOME/build-tools/35.0.0" `
            -AndroidJar "$env:ANDROID_HOME/platforms/android-35/android.jar" `
            -SigningKey "$env:RUNNER_TEMP/ops-test.p12" -TestBuild `
            -OAuthClientId fixture-client-id -OutputApk "$env:RUNNER_TEMP/ops-test.apk"
      - name: Run OAuth and saved-site regressions
        env:
          ANDROID_SDK_BUILD_TOOLS_VERSION: '35.0.0'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          echo no | avdmanager create avd -n ops-ci -k 'system-images;android-30;google_apis;x86_64'
          "$ANDROID_HOME/emulator/emulator" -avd ops-ci -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader >"$RUNNER_TEMP/emulator.log" 2>&1 &
          emulator_pid=$!
          trap 'status=$?; if (( status )); then tail -100 "$RUNNER_TEMP/emulator.log"; fi; kill "$emulator_pid" 2>/dev/null || true' EXIT
          deadline=$((SECONDS + 240))
          until [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" == 1 ]]; do
            kill -0 "$emulator_pid" && (( SECONDS < deadline )) || exit 1
            sleep 2
          done
          adb shell input keyevent 82
          bash android/tests/run.sh "$RUNNER_TEMP/ops-test.apk" "$RUNNER_TEMP/ops-test.p12" "$RUNNER_TEMP/ops-instrumentation"
